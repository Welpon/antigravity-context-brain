<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context Brain</title>
  <style>:root {
  --bg-1: var(--color-background-primary, #0f1115);
  --bg-2: var(--color-background-secondary, #161920);
  --bg-3: var(--color-background-tertiary, #222631);
  --fg-1: var(--color-text-primary, #f1f5f9);
  --fg-2: var(--color-text-secondary, #94a3b8);
  --fg-3: var(--color-text-tertiary, #64748b);
  --border-1: var(--color-border-primary, rgba(148, 163, 184, 0.16));
  --border-2: var(--color-border-secondary, rgba(148, 163, 184, 0.28));
  --info-bg: var(--color-background-info, rgba(59, 130, 246, 0.14));
  --info-fg: var(--color-text-info, #60a5fa);
  --ok-bg: var(--color-background-success, rgba(16, 185, 129, 0.14));
  --ok-fg: var(--color-text-success, #34d399);
  --warn-bg: var(--color-background-warning, rgba(245, 158, 11, 0.14));
  --warn-fg: var(--color-text-warning, #fbbf24);
  --danger-bg: var(--color-background-danger, rgba(239, 68, 68, 0.14));
  --danger-fg: var(--color-text-danger, #f87171);
  --cache-col: #4f8cff;
  --uncached-col: #22c55e;
  --accent: #4f8cff;
  --accent-hover: #3b78f0;
  --radius: 8px;
  --radius-sm: 6px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg-1);
  color: var(--fg-1);
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  font-size: 12.5px;
  line-height: 1.4;
}

.shell {
  max-width: 860px;
  margin: 0 auto;
  padding: 10px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Compact Header */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--border-1);
  padding-bottom: 8px;
}

.tabs {
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
}

.tab-btn {
  border: none;
  background: transparent;
  color: var(--fg-2);
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 9px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.tab-btn:hover {
  color: var(--fg-1);
}

.tab-btn.active {
  background: var(--bg-3);
  color: var(--fg-1);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.live-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: none;
  background: transparent;
  color: var(--fg-3);
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 6px;
  border-radius: 5px;
  cursor: pointer;
}

.live-btn:hover {
  background: var(--bg-2);
  color: var(--fg-1);
}

.live-btn.on {
  color: var(--ok-fg);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--fg-2);
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 13px;
}

.icon-btn:hover:not(:disabled) {
  background: var(--bg-2);
  color: var(--fg-1);
}

.icon-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.lang-btn {
  border: 1px solid var(--border-1);
  background: var(--bg-2);
  color: var(--fg-2);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 0.03em;
}

.lang-btn:hover {
  background: var(--bg-3);
  color: var(--fg-1);
}

/* Conversation Selector Block */
.conv-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.conv-select-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.conv-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok-fg);
  flex-shrink: 0;
}

.conv-select {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  color: var(--fg-1);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 2px 4px 2px 0;
  outline: none;
  cursor: pointer;
  text-overflow: ellipsis;
}

.conv-select option {
  background: var(--bg-2);
  color: var(--fg-1);
}

.conv-meta {
  font-size: 11px;
  color: var(--fg-3);
  padding-left: 12px;
  font-family: var(--mono);
}

/* Hero Utilization */
.hero-section {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-top: 2px;
}

.hero-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.hero-pct {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}

.hero-pct small {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg-2);
}

.hero-ratio {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-1);
}

.hero-slash {
  color: var(--fg-3);
}

.limit-inline {
  border: none;
  background: transparent;
  color: var(--fg-2);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  padding: 1px 2px;
  border-radius: 4px;
}

.limit-inline:hover {
  background: var(--bg-2);
  color: var(--fg-1);
}

.limit-inline option {
  background: var(--bg-2);
  color: var(--fg-1);
}

/* Dual-color Progress Bar */
.dual-track {
  width: 100%;
  height: 7px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
  display: flex;
}

.dual-cache {
  height: 100%;
  background: var(--cache-col);
  transition: width 0.3s ease;
}

.dual-uncached {
  height: 100%;
  background: var(--uncached-col);
  transition: width 0.3s ease;
}

.dual-legend {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--fg-2);
  flex-wrap: wrap;
}

.dual-legend-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.leg-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.leg-item strong {
  color: var(--fg-1);
  font-weight: 600;
  font-family: var(--mono);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.dot-cache { background: var(--cache-col); }
.dot-uncached { background: var(--uncached-col); }

/* 3-Column Minimal KPI Row */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--border-1);
  border-bottom: 1px solid var(--border-1);
}

.kpi-cell {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.kpi-k {
  font-size: 11px;
  color: var(--fg-3);
}

.kpi-v {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.kpi-v small {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--fg-2);
}

.kpi-sub {
  font-size: 10.5px;
  color: var(--fg-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Section Headers */
.sec {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.sec-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-2);
  margin: 0;
}

.sec-meta {
  font-size: 11px;
  color: var(--fg-3);
  font-family: var(--mono);
}

/* Area Timeline Chart */
.timeline-box {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.timeline-main {
  display: flex;
  align-items: stretch;
  gap: 8px;
}

.area-chart-svg {
  flex: 1;
  min-width: 0;
  height: 140px;
  display: block;
}

.timeline-yaxis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-3);
  line-height: 1;
  padding: 2px 0;
  min-width: 38px;
  flex-shrink: 0;
}

.timeline-xaxis {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-3);
  padding-right: 46px;
}

.timeline-leg {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-sans, sans-serif);
  font-size: 10.5px;
  color: var(--fg-3);
}

/* Top Spikes */
.spike-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.spike-item {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid transparent;
  transition: border-color 0.15s;
}

.spike-item:hover {
  border-color: var(--border-1);
}

.spike-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 7px;
}

.spike-row.clickable {
  cursor: pointer;
}

.spike-details {
  border-top: 1px solid var(--border-1);
  padding: 5px 8px 6px 32px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.spike-tool-line {
  display: flex;
  align-items: baseline;
  gap: 5px;
  font-size: 11px;
  color: var(--fg-2);
  min-width: 0;
}

.spike-tool-bullet {
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}

.spike-tool-name {
  color: var(--fg-1);
  font-weight: 600;
  flex-shrink: 0;
}

.spike-tool-target {
  color: var(--fg-3);
  font-family: var(--mono);
  font-size: 10.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.spike-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  flex: 1;
}

.spike-step {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-3);
  flex-shrink: 0;
  min-width: 26px;
}

.spike-tools-pill {
  font-size: 10px;
  color: var(--fg-2);
  background: var(--bg-3);
  padding: 1px 5px;
  border-radius: 4px;
  flex-shrink: 0;
}

.spike-label {
  font-size: 11.5px;
  color: var(--fg-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--mono);
}

.spike-delta {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--fg-1);
  flex-shrink: 0;
}

/* Warning Banner (only shown when warning/critical) */
.warn-banner {
  font-size: 11.5px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.warn-banner.warning {
  background: var(--warn-bg);
  color: var(--warn-fg);
}

.warn-banner.critical {
  background: var(--danger-bg);
  color: var(--danger-fg);
}

/* Collapsible Breakdown */
.details-box {
  border-top: 1px solid var(--border-1);
  padding-top: 8px;
}

.details-box summary {
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--fg-3);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.details-box summary::-webkit-details-marker {
  display: none;
}

.details-body {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stacked-bar {
  display: flex;
  width: 100%;
  height: 7px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-3);
  gap: 1px;
}

.seg { height: 100%; min-width: 2px; }
.seg-sys { background: #64748b; }
.seg-user { background: #4f8cff; }
.seg-tool { background: #f59e0b; }
.seg-model { background: #22c55e; }
.seg-think { background: #a855f7; }

.legend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 5px;
}

.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 11px;
  background: var(--bg-2);
  border-radius: 5px;
  padding: 4px 7px;
  color: var(--fg-2);
}

.legend-item strong {
  color: var(--fg-1);
  font-family: var(--mono);
  font-size: 10.5px;
}

.heavy-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.heavy-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
}

.heavy-info {
  min-width: 0;
  flex: 1;
}

.heavy-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-1);
}

.heavy-preview {
  font-size: 11px;
  line-height: 1.42;
  color: var(--fg-2);
  white-space: normal;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 3px;
}

.heavy-tok {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-2);
  flex-shrink: 0;
}

/* Shared Buttons, Inputs, Packs */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid var(--border-1);
  background: var(--bg-2);
  color: var(--fg-1);
  border-radius: var(--radius-sm);
  padding: 5px 9px;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  background: var(--bg-3);
  border-color: var(--border-2);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-danger {
  background: var(--danger-bg);
  color: var(--danger-fg);
  border-color: transparent;
}

.btn-sm {
  padding: 3px 7px;
  font-size: 11px;
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: var(--radius);
  padding: 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input,
.textarea {
  background: var(--bg-1);
  color: var(--fg-1);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}

.input:focus,
.textarea:focus {
  border-color: var(--accent);
}

.textarea {
  min-height: 70px;
  resize: vertical;
  font-family: var(--mono);
}

.form-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-2);
}

.form-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

.pack-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pack-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.pack-name {
  font-size: 13px;
  font-weight: 700;
  margin: 0;
}

.pack-desc {
  font-size: 11.5px;
  color: var(--fg-2);
  margin: 2px 0 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  font-family: var(--mono);
  background: var(--info-bg);
  color: var(--info-fg);
  flex-shrink: 0;
}

.pack-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--fg-2);
}

.file-chip-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.file-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  padding: 4px 7px;
  border-radius: 5px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
}

.file-chip.missing {
  border-color: var(--danger-fg);
  color: var(--danger-fg);
}

.file-path {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--mono);
}

.pack-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  padding-top: 6px;
  border-top: 1px solid var(--border-1);
}

.attached-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  background: var(--info-bg);
  color: var(--info-fg);
  font-size: 11.5px;
}

.toast {
  position: fixed;
  bottom: 12px;
  right: 12px;
  background: var(--fg-1);
  color: var(--bg-1);
  padding: 7px 12px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
  z-index: 100;
  max-width: 300px;
}

.empty {
  text-align: center;
  padding: 20px 10px;
  color: var(--fg-3);
  font-size: 12px;
}

/* Memory Vault */
.vault-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid var(--border-1);
}

.vault-path-wrap {
  min-width: 0;
  flex: 1;
}

.vault-path {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vault-hint {
  font-size: 10px;
  color: var(--fg-3);
  margin-top: 1px;
}

.action-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.action-strip .btn {
  flex: 1 1 calc(50% - 5px);
}

.search-row {
  display: flex;
  gap: 6px;
}

.search-input {
  flex: 1;
  min-width: 0;
}

.filter-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.pill-btn {
  border: 1px solid var(--border-1);
  background: var(--bg-2);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}

.pill-btn:hover {
  color: var(--fg-1);
}

.pill-btn.active {
  background: var(--info-bg);
  color: var(--info-fg);
  border-color: var(--info-fg);
}

.kind-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  flex-shrink: 0;
}

.kind-handoff { background: var(--ok-bg); color: var(--ok-fg); }
.kind-decision { background: var(--info-bg); color: var(--info-fg); }
.kind-task { background: rgba(168, 85, 247, 0.16); color: #c084fc; }
.kind-inbox { background: var(--warn-bg); color: var(--warn-fg); }
.kind-pack { background: rgba(20, 184, 166, 0.16); color: #2dd4bf; }
.kind-note { background: var(--bg-3); color: var(--fg-2); }

.task-done {
  text-decoration: line-through;
  opacity: 0.6;
}

.task-filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.task-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--fg-3);
  padding: 6px 4px 2px;
  border-bottom: 1px solid var(--border-1);
}

.status-select-sm {
  background: var(--bg-1);
  color: var(--fg-1);
  border: 1px solid var(--border-1);
  border-radius: 5px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.status-select-sm option {
  background: var(--bg-2);
  color: var(--fg-1);
}

.log-card {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-sm);
  padding: 8px 9px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}

.log-card:hover {
  border-color: var(--border-2);
}

.log-changes {
  border-top: 1px solid var(--border-1);
  margin-top: 4px;
  padding-top: 5px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10.5px;
}

.log-change-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.log-change-k {
  color: var(--fg-3);
  min-width: 68px;
  font-weight: 600;
  flex-shrink: 0;
}

.log-change-v {
  font-family: var(--mono);
  color: var(--fg-1);
  word-break: break-word;
}

.log-old {
  text-decoration: line-through;
  opacity: 0.55;
  margin-right: 4px;
}

.log-day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--fg-3);
  padding: 6px 2px 2px;
  border-bottom: 1px solid var(--border-1);
}

.due-chip {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg-3);
  color: var(--fg-2);
}

.due-overdue {
  background: var(--danger-bg);
  color: var(--danger-fg);
  font-weight: 700;
}

.due-soon {
  background: var(--warn-bg);
  color: var(--warn-fg);
  font-weight: 700;
}

.log-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.log-ts {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-3);
  white-space: nowrap;
}

.log-detail {
  font-size: 11px;
  color: var(--fg-2);
  line-height: 1.35;
}

.note-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--fg-3);
  font-family: var(--mono);
}

.note-preview {
  font-size: 11.5px;
  color: var(--fg-2);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hidden {
  display: none !important;
}
