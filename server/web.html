<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context Brain Web</title>
  <style>
    :root {
      --bg: #0c0e13;
      --sidebar: #11141c;
      --card: #171b26;
      --card-2: #1d2230;
      --border: rgba(148, 163, 184, 0.16);
      --border-2: rgba(148, 163, 184, 0.28);
      --fg: #f1f5f9;
      --fg-2: #94a3b8;
      --fg-3: #64748b;
      --accent: #4f8cff;
      --accent-hover: #3b78f0;
      --ok: #22c55e;
      --warn: #eab308;
      --danger: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: var(--sans); font-size: 13px; line-height: 1.45;
    }
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; font-size: 12px; flex-shrink: 0;
    }
    .brand-name { font-weight: 700; font-size: 14px; }
    .brand-sub { font-size: 11px; color: var(--fg-3); font-family: var(--mono); }
    .nav { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .nav-group {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--fg-3); text-transform: uppercase;
      padding: 10px 10px 4px;
    }
    .nav-group:first-child { padding-top: 4px; }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid transparent; background: transparent; color: var(--fg-2);
      padding: 8px 10px; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left; font-family: inherit;
    }
    .nav-btn:hover { background: var(--card); color: var(--fg); }
    .nav-btn.active {
      background: var(--card-2); color: var(--fg);
      border-color: var(--border);
    }
    .nav-count {
      font-family: var(--mono); font-size: 11px; color: var(--fg-3);
    }
    .side-footer {
      display: flex; flex-direction: column; gap: 7px;
      border-top: 1px solid var(--border); padding-top: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      padding: 7px 11px; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn:hover { background: var(--card-2); border-color: var(--border-2); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-warn { background: #a18824; border-color: #b59a2e; color: #fff; }
    .btn-warn:hover { filter: brightness(1.08); }
    .btn-danger { background: rgba(239, 68, 68, 0.14); color: #f87171; border-color: transparent; }
    .btn-sm { padding: 4px 8px; font-size: 11.5px; }
    .idle-note { font-size: 10.5px; color: var(--fg-3); text-align: center; }

    .main {
      padding: 20px 24px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .page-title { font-size: 20px; font-weight: 700; margin: 0; }
    .page-sub { font-size: 12px; color: var(--fg-2); margin-top: 3px; }
    .toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .input, .select, .textarea {
      background: var(--card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 10px; font-family: inherit; font-size: 12.5px; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .select option { background: var(--card); color: var(--fg); }

    /* 5-Column Kanban */
    .kanban {
      display: grid;
      grid-template-columns: repeat(5, minmax(190px, 1fr));
      gap: 12px;
      overflow-x: auto;
      align-items: start;
      padding-bottom: 12px;
    }
    .col {
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 360px;
      transition: border-color 0.15s, background 0.15s;
    }
    .col.drag-over {
      border-color: var(--accent);
      background: rgba(79, 140, 255, 0.08);
    }
    .col-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--fg-2); padding: 2px 4px 6px;
      border-bottom: 1px solid var(--border);
    }
    .col-count { font-family: var(--mono); color: var(--fg-3); }
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: grab;
    }
    .task-card:active { cursor: grabbing; }
    .task-card:hover { border-color: var(--border-2); }
    .task-title {
      font-weight: 700; font-size: 13px; color: var(--fg);
      cursor: pointer;
    }
    .task-title:hover { color: var(--accent); }
    .task-title.done { text-decoration: line-through; opacity: 0.65; }
    .task-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      font-size: 11px; color: var(--fg-3); font-family: var(--mono);
    }
    .proj-chip {
      display: inline-block; max-width: 140px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--fg-2);
    }
    .prio-high { color: #f87171; font-weight: 700; }
    .prio-low { color: var(--fg-3); }
    .card-row {
      display: flex; align-items: center; gap: 6px;
    }
    .status-select {
      flex: 1; background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 6px; font-size: 11.5px; cursor: pointer;
    }
    .del-icon {
      border: none; background: transparent; color: var(--fg-3);
      cursor: pointer; padding: 3px 5px; border-radius: 5px; font-size: 12px;
    }
    .del-icon:hover { background: rgba(239, 68, 68, 0.16); color: #f87171; }

    /* Cards & Grids */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }
    .kpi-val { font-size: 22px; font-weight: 700; font-family: var(--mono); }
    .kpi-label { font-size: 11.5px; color: var(--fg-3); }
    .dual-track {
      width: 100%; height: 9px; background: var(--card-2);
      border-radius: 999px; overflow: hidden; display: flex;
    }
    .dual-cache { background: var(--accent); height: 100%; }
    .dual-uncached { background: var(--ok); height: 100%; }
    .note-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .badge {
      display: inline-flex; padding: 2px 7px; border-radius: 5px;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      background: rgba(79, 140, 255, 0.16); color: #60a5fa;
    }
    .badge-handoff { background: rgba(34, 197, 94, 0.16); color: #4ade80; }
    .badge-decision { background: rgba(79, 140, 255, 0.16); color: #60a5fa; }
    .badge-task { background: rgba(168, 85, 247, 0.16); color: #c084fc; }
    .badge-inbox { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
    .spike-item {
      border-radius: 7px; background: var(--sidebar);
      border: 1px solid transparent; overflow: hidden;
    }
    .spike-item:hover { border-color: var(--border); }
    .spike-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 10px; font-family: var(--mono); font-size: 12px;
      cursor: pointer;
    }
    .spike-tools {
      border-top: 1px solid var(--border);
      padding: 6px 12px 8px 28px;
      display: flex; flex-direction: column; gap: 3px;
      font-size: 11.5px; color: var(--fg-2);
    }
    .spike-pill {
      font-size: 10.5px; background: var(--card-2); color: var(--fg-2);
      padding: 1px 6px; border-radius: 4px; margin-right: 6px;
    }
    .timeline-main { display: flex; align-items: stretch; gap: 10px; }
    .area-svg { flex: 1; min-width: 0; height: 150px; display: block; }
    .timeline-yaxis {
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: flex-end; font-family: var(--mono); font-size: 11px;
      color: var(--fg-3); min-width: 44px; padding: 2px 0;
    }
    .timeline-xaxis {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 11px; color: var(--fg-3);
      padding-right: 54px; margin-top: 4px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .stacked-bar {
      display: flex; width: 100%; height: 9px; border-radius: 999px;
      overflow: hidden; background: var(--card-2); gap: 1px;
    }
    .legend-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px;
    }
    .legend-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 9px; border-radius: 6px; background: var(--sidebar);
      font-size: 12px; color: var(--fg-2);
    }
    .legend-item strong { color: var(--fg); font-family: var(--mono); font-size: 11.5px; }
    .heavy-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 8px 10px; border-radius: 7px; background: var(--sidebar);
    }
    .heavy-head { font-size: 12px; font-weight: 600; color: var(--fg); }
    .heavy-desc { font-size: 11.5px; color: var(--fg-2); margin-top: 2px; }
    .heavy-tok { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--fg-2); flex-shrink: 0; }
    .log-list { display: flex; flex-direction: column; gap: 12px; }
    .log-day-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; font-weight: 700; color: var(--fg-2);
      padding: 4px 2px; border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .log-row {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 12px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); cursor: pointer;
    }
    .log-row:hover { border-color: var(--border-2); }
    .log-row-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .log-changes {
      border-top: 1px solid var(--border);
      padding-top: 7px; display: flex; flex-direction: column; gap: 4px;
      font-size: 11.5px;
    }
    .log-change-line { display: flex; align-items: baseline; gap: 8px; }
    .log-change-k { color: var(--fg-3); min-width: 84px; font-weight: 600; flex-shrink: 0; }
    .log-change-v { font-family: var(--mono); color: var(--fg); word-break: break-word; }
    .log-old { text-decoration: line-through; opacity: 0.55; margin-right: 6px; }
    .log-source {
      font-size: 10px; font-family: var(--mono); padding: 1px 6px;
      border-radius: 4px; background: var(--bg); border: 1px solid var(--border);
      color: var(--fg-2);
    }
    .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      border: 1px solid var(--border); background: var(--card); color: var(--fg-2);
      border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .log-time {
      text-align: right; font-family: var(--mono); font-size: 11px; color: var(--fg-3);
      flex-shrink: 0; white-space: nowrap;
    }
    .log-rel { color: var(--fg-2); font-weight: 600; margin-top: 2px; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 200;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border-2);
      border-radius: 12px; max-width: 720px; width: 100%;
      max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .modal-body {
      padding: 16px; overflow: auto;
      white-space: pre-wrap; font-family: var(--mono); font-size: 12px;
      color: var(--fg-2); line-height: 1.55;
    }
    .toast {
      position: fixed; bottom: 16px; right: 16px;
      background: var(--fg); color: var(--bg);
      padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 300;
    }
    .hidden { display: none !important; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
    }
  </style>
</head>

      update_steps: 'Adım Güncelle',

    function localizeLabel(label) {
      if (!label) return '';
      let text = String(label);
      if (state.lang === 'en') {
        return text
          .replace(/^Model \+ Araçlar /, 'Model + Tools ')
          .replace(/^Kullanıcı Mesajı$/, 'User Message')
          .replace(/^Araç Çıktısı$/, 'Tool Output')
          .replace(/^Sistem Mesajı$/, 'System Message')
          .replace(/^Model Yanıtı$/, 'Model Response');
      }
      text = text.replace(/^user · /, 'Kullanıcı · ');
      for (const [raw, trName] of Object.entries(TOOL_LABELS_TR)) {
        text = text.replace(new RegExp(`\\b${raw}\\b`, 'g'), trName);
      }
      return text;
    }

    function fmtRel(iso) {
      if (!iso) return '';
      const diff = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diff < 5) return t('justNow');
      if (diff < 60) return t('secAgo')(diff);
      const m = Math.floor(diff / 60);
      if (m < 60) return t('minAgo')(m);
      const h = Math.floor(m / 60);
      if (h < 24) return t('hrAgo')(h);
      return t('dayAgo')(Math.floor(h / 24));
    }

    function humanizeWebPreview(preview) {
      const isTr = state.lang === 'tr';
      if (!preview || preview === '__desc:empty') return isTr ? 'Boş adım çıktısı.' : 'Empty step output.';
      const str = String(preview);
      if (!str.startsWith('__desc:')) return str.length > 100 ? `${str.slice(0, 99)}…` : str;
      const parts = str.slice(7).split('|');
      const kind = parts[0];
      if (kind === 'actions') {
        const rawItems = (parts[1] || '').split(';').filter(Boolean);
        const groups = new Map();
        for (const entry of rawItems) {
          const ci = entry.indexOf(':');
          const tool = ci === -1 ? entry : entry.slice(0, ci);
          const target = ci === -1 ? '' : entry.slice(ci + 1);
          if (!groups.has(tool)) groups.set(tool, []);
          groups.get(tool).push(target);
        }
        const fmtList = (arr) => {
          const u = [...new Set(arr.filter(Boolean))];
          if (!u.length) return '';
          if (u.length === 1) return u[0];
          return `${u.slice(0, -1).join(', ')}${isTr ? ' ve ' : ' and '}${u[u.length - 1]}`;
        };
        const clauses = [];
        for (const [tool, targets] of groups.entries()) {
          const names = fmtList(targets);
          const cnt = targets.length;
          const uLen = new Set(targets.filter(Boolean)).size;
          if (tool === 'write_file') clauses.push(isTr ? (names ? `${names} ${uLen > 1 ? 'dosyaları' : 'dosyası'} güncellendi` : `${cnt} dosya oluşturuldu`) : (names ? `Updated ${names}` : `Created ${cnt} file(s)`));
          else if (tool === 'edit_file') clauses.push(isTr ? (names ? `${names} düzenlendi` : `${cnt} dosya düzenlendi`) : (names ? `Edited ${names}` : `Edited ${cnt} file(s)`));
          else if (tool === 'read_file') clauses.push(isTr ? (cnt > 1 && uLen === 1 ? `${cnt} adet ${targets[0]} belgesi incelendi` : (names ? `${names} incelendi` : `${cnt} belge incelendi`)) : (names ? `Reviewed ${names}` : `Reviewed ${cnt} file(s)`));
          else if (tool === 'run_command') clauses.push(isTr ? 'sistem kontrolü/derleme çalıştırıldı' : 'ran a build/check command');
          else clauses.push(isTr ? `${localizeLabel(tool)} işlemi yapıldı` : `ran ${tool}`);
        }
        const s = clauses.join(', ');
        const out = s ? s.charAt(0).toUpperCase() + s.slice(1) + '.' : (isTr ? 'Planlanan adımlar tamamlandı.' : 'Completed planned actions.');
        return out.length > 100 ? `${out.slice(0, 99)}…` : out;
      }
      if (kind === 'read_lines') return isTr ? `Belgeden toplam ${parts[1]} satırlık içerik okunup incelendi.` : `Read and reviewed ${parts[1]} lines from a document.`;
      if (kind === 'cmd_exit') return isTr ? (parts[1] === '0' ? 'Çalıştırılan işlem sorunsuz tamamlandı.' : 'Çalıştırılan işlem hata ile sonlandı.') : (parts[1] === '0' ? 'The command completed successfully.' : 'The command finished with an error.');
      if (kind === 'file_edit') return isTr ? `${parts[2]} üzerinde ${parts[1]} düzenleme uygulandı.` : `Applied ${parts[1]} edit(s) to ${parts[2]}.`;
      if (kind === 'file_created') return isTr ? 'Yeni dosya başarıyla oluşturuldu.' : 'New file was created successfully.';
      return isTr ? 'İşlem tamamlandı.' : 'Action completed.';
    }

    function renderWebTimeline(timeline, firstStep, lastStep) {
      if (!timeline || !timeline.length) return `<div style="color:var(--fg-3);">${esc(t('noItems'))}</div>`;
      const w = 640, h = 150, padL = 2, padR = 6, padT = 8, padB = 4;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const maxTok = Math.max(...timeline.map((x) => x.contextTokens || 0), 1);
      const pts = timeline.map((item, i) => {
        const x = timeline.length === 1 ? padL + plotW : padL + (i / (timeline.length - 1)) * plotW;
        const yTotal = padT + plotH - ((item.contextTokens || 0) / maxTok) * plotH;
        const yCache = padT + plotH - ((item.cacheReadTokens || 0) / maxTok) * plotH;
        return { x, yTotal, yCache, item };
      });
      const totalD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.yTotal.toFixed(1)}`).join(' ');
      const cacheD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.yCache.toFixed(1)}`).join(' ');
      const areaD = `${cacheD} L ${pts[pts.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${pts[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`;
      const last = pts[pts.length - 1];
      return `
        <div class="timeline-main">
          <svg class="area-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
            <defs>
              <linearGradient id="wCacheGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.34"/>
                <stop offset="100%" stop-color="#4f8cff" stop-opacity="0.03"/>
              </linearGradient>
            </defs>
            <line x1="${padL}" y1="${padT}" x2="${padL + plotW}" y2="${padT}" stroke="currentColor" stroke-opacity="0.09" stroke-dasharray="2,3" vector-effect="non-scaling-stroke" />
            <line x1="${padL}" y1="${padT + plotH / 2}" x2="${padL + plotW}" y2="${padT + plotH / 2}" stroke="currentColor" stroke-opacity="0.09" stroke-dasharray="2,3" vector-effect="non-scaling-stroke" />
            <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="currentColor" stroke-opacity="0.16" vector-effect="non-scaling-stroke" />
            <path d="${areaD}" fill="url(#wCacheGrad)" />
            <path d="${cacheD}" fill="none" stroke="#4f8cff" stroke-width="1.6" vector-effect="non-scaling-stroke" />
            <path d="${totalD}" fill="none" stroke="#22c55e" stroke-width="2" vector-effect="non-scaling-stroke" />
            <ellipse cx="${last.x.toFixed(1)}" cy="${last.yTotal.toFixed(1)}" rx="3.2" ry="3.4" fill="#22c55e" />
          </svg>
          <div class="timeline-yaxis">
            <span>${esc(fmtCompact(maxTok))}</span>
            <span>${esc(fmtCompact(maxTok / 2))}</span>
            <span>0</span>
          </div>
        </div>
        <div class="timeline-xaxis">
          <span>#${firstStep}</span>
          <span>
            <span class="dot" style="background:#22c55e;"></span>${esc(t('totalLabel'))}
            &nbsp;&nbsp;
            <span class="dot" style="background:#4f8cff;"></span>${esc(t('cache'))}
          </span>
          <span>#${lastStep}</span>
        </div>
      `;
    }

    function t(key) {
      return (I18N[state.lang] || I18N.en)[key] ?? key;

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtCompact(n) {
      const num = Number(n || 0);
      const uM = state.lang === 'tr' ? 'Mn' : 'M';
      const uK = state.lang === 'tr' ? 'B' : 'K';
      if (num >= 1_000_000) return `${(num / 1_000_000).toFixed(1)}${uM}`;
      if (num >= 100_000) return `${Math.round(num / 1_000)}${uK}`;
      if (num >= 1_000) return `${(num / 1_000).toFixed(1)}${uK}`;
      return String(Math.round(num));
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Request failed');
      return json;
    }

    async function loadState(silent = true) {
      const qs = state.selectedConvId ? `?conv=${encodeURIComponent(state.selectedConvId)}` : '';
      const d = await api(`/api/state${qs}`);
      state.data = d;
      if (d.prefs?.lang) {
        state.lang = d.prefs.lang;
        document.documentElement.lang = state.lang;
      }
      if (!state.selectedConvId && d.analysis?.conversationId) {
        state.selectedConvId = d.analysis.conversationId;
      }
      if (!silent) showToast(t('toastSynced'));
      render();
    }

    function renderCockpitView() {
      const a = state.data?.analysis;
      const convs = state.data?.conversations || [];
      const convOpts = convs
        .map((c) => `<option value="${esc(c.id)}" ${c.id === state.selectedConvId ? 'selected' : ''}>${esc(c.title)} (${fmtCompact(c.latestContextTokens)})</option>`)
        .join('');

      if (!a || !a.found) {
        return `<div class="card">${esc(t('noItems'))}</div>`;
      }

      const cachePct = a.contextLimit > 0 ? Math.min(100, (a.latestCacheReadTokens / a.contextLimit) * 100) : 0;
      const uncachedPct = a.contextLimit > 0 ? Math.min(100 - cachePct, (a.latestInputTokens / a.contextLimit) * 100) : 0;

      const spikesHtml = (a.topSpikes || [])
        .map((s) => {
          const hasTools = Array.isArray(s.tools) && s.tools.length > 0;
          const isOpen = hasTools && state.expandedSpikes.has(s.stepIndex);
          const toolsList = isOpen
            ? `<div class="spike-tools">${s.tools
                .map((toolObj) => {
                  const rawName = toolObj?.name || 'tool';
                  const name = state.lang === 'tr' ? (TOOL_LABELS_TR[rawName] || rawName) : rawName;
                  let target = toolObj?.target || '';
                  if (!target && rawName === 'update_steps') target = state.lang === 'tr' ? 'görev listesi' : 'task checklist';

                })
                .join('')}</div>`
            : '';
          return `
            <div class="spike-item">
              <div class="spike-row" ${hasTools ? `data-wspike="${s.stepIndex}"` : ''}>
                <span>
                  <span style="color:var(--fg-3);margin-right:6px;">#${s.stepIndex}</span>
                  ${s.toolCount > 1 ? `<span class="spike-pill">${s.toolCount} ${esc(t('toolsUnit'))} ${isOpen ? '▴' : '▾'}</span>` : ''}

                </span>
                <strong>+${fmtCompact(s.deltaTokens)}</strong>
              </div>
              ${toolsList}
            </div>
          `;
        })
        .join('');

      const heaviestHtml = (a.heaviestSteps || [])
        .map((s) => `
          <div class="heavy-row">
            <div style="min-width:0;flex:1;">
              <div class="heavy-head"><span style="color:var(--fg-3);font-family:var(--mono);margin-right:6px;">#${s.stepIndex}</span>${esc(localizeLabel(s.label))}</div>
              <div class="heavy-desc">${esc(humanizeWebPreview(s.preview))}</div>
            </div>
            <div class="heavy-tok">~${fmtCompact(s.tokens)}</div>
          </div>
        `)
        .join('');

      const b = a.breakdown || {};
      const bTot = (b.systemOverhead || 0) + (b.toolOutputs || 0) + (b.userMessages || 0) + (b.modelResponses || 0) + (b.thinking || 0);
      const bPct = (v) => (bTot > 0 ? Math.round((v / bTot) * 100) : 0);

      return `
        <div class="page-head">
          <div>
            <h1 class="page-title">${esc(t('cockpitTitle'))}</h1>
            <div class="page-sub">${esc(a.model)} · ${esc(fmtRel(a.updatedAt))}</div>
          </div>
          <select id="convSelect" class="select" style="max-width:340px;">${convOpts}</select>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div style="font-size:28px;font-weight:800;">${a.utilizationPct}%</div>
            <div style="font-family:var(--mono);color:var(--fg-2);">${fmtCompact(a.latestContextTokens)} / ${fmtCompact(a.contextLimit)}</div>
          </div>
          <div class="dual-track">
            <div class="dual-cache" style="width:${cachePct.toFixed(2)}%"></div>
            <div class="dual-uncached" style="width:${uncachedPct.toFixed(2)}%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);font-family:var(--mono);">
            <span>${esc(t('cache'))}: ${fmtCompact(a.latestCacheReadTokens)} · ${esc(t('uncached'))}: ${fmtCompact(a.latestInputTokens)}</span>
            <span>${esc(t('free'))}: ${fmtCompact(a.remainingTokens)}</span>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="card"><div class="kpi-label">${esc(t('cacheHit'))}</div><div class="kpi-val">${a.latestCacheHitPct}%</div></div>
          <div class="card"><div class="kpi-label">${esc(t('output'))}</div><div class="kpi-val">${fmtCompact(a.cumulative?.outputTokens)}</div></div>
          <div class="card"><div class="kpi-label">${esc(t('turns'))}</div><div class="kpi-val">${a.turns}</div></div>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${esc(t('timeline'))}</strong>
            <span style="font-family:var(--mono);font-size:11.5px;color:var(--fg-3);">${a.turns} ${esc(t('turns'))}</span>
          </div>
          ${renderWebTimeline(a.turnTimeline, a.firstStepIndex ?? 1, a.lastStepIndex ?? a.stepCount)}
        </div>

        <div class="card">
          <strong>${esc(t('topSpikes'))}</strong>
          ${spikesHtml || `<div style="color:var(--fg-3);">${esc(t('noItems'))}</div>`}
        </div>

        <div class="card">
          <strong>${esc(t('heaviestSteps'))}</strong>
          ${heaviestHtml || `<div style="color:var(--fg-3);">${esc(t('noItems'))}</div>`}
        </div>

        <div class="card">
          <strong>${esc(t('breakdown'))}</strong>
          <div class="stacked-bar">
            <div style="width:${bPct(b.systemOverhead)}%;background:#64748b;"></div>
            <div style="width:${bPct(b.toolOutputs)}%;background:#f59e0b;"></div>
            <div style="width:${bPct(b.userMessages)}%;background:#4f8cff;"></div>
            <div style="width:${bPct(b.modelResponses)}%;background:#22c55e;"></div>
            <div style="width:${bPct(b.thinking)}%;background:#a855f7;"></div>
          </div>
          <div class="legend-grid">
            <div class="legend-item"><span><span class="dot" style="background:#64748b;"></span>${esc(t('catSystem'))}</span><strong>${fmtCompact(b.systemOverhead)} (${bPct(b.systemOverhead)}%)</strong></div>
            <div class="legend-item"><span><span class="dot" style="background:#f59e0b;"></span>${esc(t('catTools'))}</span><strong>${fmtCompact(b.toolOutputs)} (${bPct(b.toolOutputs)}%)</strong></div>
            <div class="legend-item"><span><span class="dot" style="background:#4f8cff;"></span>${esc(t('catUser'))}</span><strong>${fmtCompact(b.userMessages)} (${bPct(b.userMessages)}%)</strong></div>
            <div class="legend-item"><span><span class="dot" style="background:#22c55e;"></span>${esc(t('catModel'))}</span><strong>${fmtCompact(b.modelResponses)} (${bPct(b.modelResponses)}%)</strong></div>
            <div class="legend-item"><span><span class="dot" style="background:#a855f7;"></span>${esc(t('catThinking'))}</span><strong>${fmtCompact(b.thinking)} (${bPct(b.thinking)}%)</strong></div>
          </div>
        </div>
      `;
    }

    function fmtDateTime(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        return d.toLocaleString(state.lang === 'tr' ? 'tr-TR' : 'en-GB', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      } catch {
        return iso;
      }
    }

    function renderMemoryView() {
      const items = state.searchResults ?? (state.data?.vault?.items || []);
      const cards = items
        .map(
          (i) => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <span class="badge badge-${esc(i.kind)}">${esc(t('kinds')[i.kind] || i.kind)}</span>
              <span style="font-family:var(--mono);font-size:11px;color:var(--fg-3);">${esc(fmtRel(i.updatedAt))} · ~${fmtCompact(i.tokens)}</span>
            </div>
            <div class="task-title" data-open-note="${esc(i.path)}">${esc(i.title)}</div>
            <div style="font-size:12px;color:var(--fg-2);">${esc(i.snippet || i.preview || '')}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--fg-3);font-family:var(--mono);">
              <span>${esc(i.relativePath)}</span>
              <button class="del-icon" data-del-path="${esc(i.path)}">🗑</button>
            </div>
          </div>
        `
        )
        .join('');

      return `
        <div class="page-head">
          <div>
            <h1 class="page-title">${esc(t('memoryTitle'))}</h1>
            <div class="page-sub">${esc(t('memorySub'))}</div>
          </div>
        </div>
        <form id="searchForm" class="toolbar">
          <input id="searchInput" class="input" style="flex:1;" placeholder="${esc(t('searchPh'))}" value="${esc(state.searchQuery)}" />
          <button type="submit" class="btn btn-primary">${esc(t('searchBtn'))}</button>
          ${state.searchQuery ? `<button type="button" id="btnClearSearch" class="btn">✕</button>` : ''}
        </form>
        <div class="note-grid">${cards || `<div class="card">${esc(t('noItems'))}</div>`}</div>
      `;
    }

    function formatDayHeading(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      const now = new Date();
      const todayKey = now.toDateString();
      const yest = new Date(now.getTime() - 86400000).toDateString();
      const locale = state.lang === 'tr' ? 'tr-TR' : 'en-US';
      const dateText = d.toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' });
      if (d.toDateString() === todayKey) return `${state.lang === 'tr' ? 'Bugün' : 'Today'} · ${dateText}`;
      if (d.toDateString() === yest) return `${state.lang === 'tr' ? 'Dün' : 'Yesterday'} · ${dateText}`;
      return dateText;
    }

    function logFieldLabel(field) {
      const tr = {
        title: 'Başlık', status: 'Durum', notes: 'Açıklama', project: 'Proje', priority: 'Öncelik',
        summary: 'Sonuç', openItems: 'Açık Konular', nextStep: 'Sonraki Adım',
        decision: 'Karar', rationale: 'Gerekçe', source: 'Kaynak', file: 'Dosya',
      };
      const en = {
        title: 'Title', status: 'Status', notes: 'Description', project: 'Project', priority: 'Priority',
        summary: 'Outcome', openItems: 'Open Items', nextStep: 'Next Step',
        decision: 'Decision', rationale: 'Rationale', source: 'Source', file: 'File',
      };
      return (state.lang === 'tr' ? tr : en)[field] || field;
    }

    function logSourceLabel(src) {
      if (src === 'web') return 'Web';
      if (src === 'antigravity') return 'Antigravity';
      return state.lang === 'tr' ? 'AI Ajan' : 'AI Agent';
    }

    function renderLogView() {
      const allLogs = state.data?.logs || [];
      const isTr = state.lang === 'tr';
      const cats = [
        { id: 'all', label: isTr ? 'Tümü' : 'All' },
        { id: 'task', label: isTr ? 'Görevler' : 'Tasks' },
        { id: 'vault', label: isTr ? 'Oturum & Karar' : 'Sessions & Decisions' },
        { id: 'delete', label: isTr ? 'Silinenler' : 'Deleted' },
      ];

      const q = state.logFilter.trim().toLowerCase();
      const filtered = allLogs.filter((l) => {
        if (state.logCat === 'task' && l.entity !== 'task') return false;
        if (state.logCat === 'vault' && !['handoff', 'decision', 'inbox', 'pack'].includes(l.entity)) return false;
        if (state.logCat === 'delete' && !l.action.includes('delete')) return false;
        if (!q) return true;
        return `${l.title} ${l.detail} ${l.project} ${l.action} ${l.relativePath || ''}`.toLowerCase().includes(q);
      });

      const byDay = new Map();
      for (const l of filtered) {
        const key = formatDayHeading(l.timestamp);
        if (!byDay.has(key)) byDay.set(key, []);
        byDay.get(key).push(l);
      }

      const fmtVal = (field, val) => (field === 'status' ? t('cols')[val] || val : val);

      const groupsHtml = [...byDay.entries()]
        .map(([day, items]) => {
          const rows = items
            .map((l) => {
              const actionText = t('logActions')[l.action] || l.action;
              const badgeKind = l.action.includes('delete') ? 'inbox' : l.entity || 'decision';
              const statusMove =
                l.fromStatus && l.toStatus && l.fromStatus !== l.toStatus
                  ? `${t('cols')[l.fromStatus] || l.fromStatus} → ${t('cols')[l.toStatus] || l.toStatus}`
                  : l.toStatus
                    ? `${t('cols')[l.toStatus] || l.toStatus}`
                    : '';
              const isOpen = state.expandedLogs.has(l.id);
              const changes = Array.isArray(l.changes) && l.changes.length > 0
                ? l.changes
                : [
                    ...(l.detail ? [{ field: 'notes', next: l.detail }] : []),
                    ...(l.relativePath ? [{ field: 'file', next: l.relativePath }] : []),
                  ];
              const changesHtml =
                isOpen && changes.length > 0
                  ? `<div class="log-changes">${changes
                      .map(
                        (c) => `
                      <div class="log-change-line">
                        <span class="log-change-k">${esc(logFieldLabel(c.field))}:</span>
                        <span class="log-change-v">
                          ${c.old ? `<span class="log-old">${esc(fmtVal(c.field, c.old))}</span>→ ` : ''}${esc(fmtVal(c.field, c.next))}
                        </span>
                      </div>
                    `
                      )
                      .join('')}</div>`
                  : '';

              const timeOnly = new Date(l.timestamp).toLocaleTimeString(isTr ? 'tr-TR' : 'en-GB', {
                hour: '2-digit', minute: '2-digit', second: '2-digit',
              });

              return `
                <div class="log-row" data-log-toggle="${esc(l.id)}">
                  <div class="log-row-top">
                    <div style="min-width:0;flex:1;">
                      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                        <span class="badge badge-${esc(badgeKind)}">${esc(actionText)}</span>
                        <strong style="font-size:13px;">${esc(l.title || '-')}</strong>
                        ${statusMove ? `<span class="spike-pill">${esc(statusMove)}</span>` : ''}
                        ${l.project ? `<span style="font-family:var(--mono);font-size:11px;color:var(--fg-3);">#${esc(l.project)}</span>` : ''}
                        <span class="log-source">${esc(logSourceLabel(l.source))}</span>
                      </div>
                      ${!isOpen && l.detail ? `<div style="font-size:12px;color:var(--fg-2);margin-top:4px;">${esc(l.detail)}</div>` : ''}
                    </div>
                    <div class="log-time">
                      <div>${esc(timeOnly)}</div>
                      <div class="log-rel">${esc(fmtRel(l.timestamp))} ${changes.length > 0 ? (isOpen ? '▴' : '▾') : ''}</div>
                    </div>
                  </div>
                  ${changesHtml}
                </div>
              `;
            })
            .join('');

          return `
            <div>
              <div class="log-day-head">
                <span>📅 ${esc(day)}</span>
                <span style="font-family:var(--mono);color:var(--fg-3);">${items.length} ${isTr ? 'kayıt' : 'entries'}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="page-head">
          <div>
            <h1 class="page-title">${esc(t('logTitle'))}</h1>
            <div class="page-sub">${esc(t('logSub'))}</div>
          </div>
          <div class="toolbar">
            <input id="logFilterInput" class="input" placeholder="${esc(t('logFilterPh'))}" value="${esc(state.logFilter)}" />
            <button id="btnClearLogs" class="btn btn-danger">${esc(t('logClearBtn'))}</button>
          </div>
        </div>
        <div class="pill-row">
          ${cats.map((c) => `<button class="pill ${state.logCat === c.id ? 'active' : ''}" data-log-cat="${c.id}">${esc(c.label)}</button>`).join('')}
        </div>
        <div class="log-list">${groupsHtml || `<div class="card">${esc(t('logEmpty'))}</div>`}</div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (state.stopped) {
        root.innerHTML = `<div style="max-width:460px;margin:18vh auto;text-align:center;" class="card"><h2>${esc(t('stoppedTitle'))}</h2><p style="color:var(--fg-2);">${esc(t('stoppedSub'))}</p></div>`;
        return;
      }

      const counts = state.data?.vault?.counts || { all: 0, task: 0 };
      const logCount = (state.data?.logs || []).length;

      root.innerHTML = `
        <div class="layout">
          <aside class="sidebar">
            <div>
              <div class="brand">
                <div class="brand-logo">CB</div>
                <div>
                  <div class="brand-name">Context Brain</div>
                  <div class="brand-sub">Web · v1.0.0</div>
                </div>
              </div>
              <nav class="nav">
                <div class="nav-group">${esc(t('catMonitor'))}</div>
                <button class="nav-btn ${state.view === 'cockpit' ? 'active' : ''}" data-nav="cockpit">
                  <span>📊 ${esc(t('navOverview'))}</span>
                </button>
                <div class="nav-group">${esc(t('catMemory'))}</div>
                <button class="nav-btn ${state.view === 'tasks' ? 'active' : ''}" data-nav="tasks">
                  <span>📋 ${esc(t('navTasks'))}</span><span class="nav-count">${counts.task || 0}</span>
                </button>
                <button class="nav-btn ${state.view === 'memory' ? 'active' : ''}" data-nav="memory">
                  <span>🧠 ${esc(t('navMemory'))}</span><span class="nav-count">${counts.all || 0}</span>
                </button>
                <div class="nav-group">${esc(t('catLog'))}</div>
                <button class="nav-btn ${state.view === 'logs' ? 'active' : ''}" data-nav="logs">
                  <span>🕒 ${esc(t('navLog'))}</span><span class="nav-count">${logCount}</span>
                </button>
              </nav>
            </div>
            <div class="side-footer">
              <button id="btnLang" class="btn">${state.lang === 'tr' ? '🌐 Dil: TR' : '🌐 Lang: EN'}</button>
              <button id="btnSync" class="btn btn-warn">↻ ${esc(t('sync'))}</button>
              <button id="btnStop" class="btn">${esc(t('stopServer'))}</button>
              <div class="idle-note">${esc(t('idleNote'))}</div>
            </div>
          </aside>
          <main class="main">
            ${
              state.view === 'tasks'
                ? renderTasksView()
                : state.view === 'cockpit'
                  ? renderCockpitView()
                  : state.view === 'memory'
                    ? renderMemoryView()
                    : renderLogView()
            }
          </main>
        </div>
      `;

      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-nav]').forEach((b) => {
        b.onclick = () => {
          state.view = b.dataset.nav;
          render();
        };
      });

      document.getElementById('btnLang')?.addEventListener('click', async () => {
        state.lang = state.lang === 'tr' ? 'en' : 'tr';
        document.documentElement.lang = state.lang;
        render();
        await api('/api/prefs', { method: 'POST', body: JSON.stringify({ lang: state.lang }) }).catch(() => {});
      });

      document.getElementById('btnSync')?.addEventListener('click', () => loadState(false));

      document.getElementById('btnStop')?.addEventListener('click', async () => {
        await api('/api/shutdown', { method: 'POST' }).catch(() => {});
        state.stopped = true;
        render();
      });

      document.getElementById('projectSelect')?.addEventListener('change', (e) => {
        state.selectedProject = e.target.value;
        render();
      });

      document.getElementById('convSelect')?.addEventListener('change', (e) => {
        state.selectedConvId = e.target.value;
        loadState(true);
      });

      document.getElementById('quickTaskForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('qtTitle').value.trim();
        const notes = document.getElementById('qtNotes').value.trim();
        const project = document.getElementById('qtProject').value.trim();
        const priority = document.getElementById('qtPrio').value;
        const status = document.getElementById('qtStatus').value;
        if (!title) return;
        await api('/api/tasks', {
          method: 'POST',
          body: JSON.stringify({ title, notes, project, priority, status, lang: state.lang }),
        });
        showToast(t('toastSaved'));
        await loadState(true);
      });

      document.querySelectorAll('[data-edit-task]').forEach((btn) => {
        btn.onclick = () => {
          const item = (state.data?.vault?.items || []).find((i) => i.path === btn.dataset.editTask);
          if (item) openEditTaskModal(item);
        };
      });

      document.querySelectorAll('[data-status-path]').forEach((sel) => {
        sel.onchange = async () => {
          await api('/api/tasks/status', {
            method: 'POST',
            body: JSON.stringify({ path: sel.dataset.statusPath, status: sel.value }),
          });
          showToast(t('toastSaved'));
          await loadState(true);
        };
      });

      document.querySelectorAll('[data-del-path]').forEach((btn) => {
        btn.onclick = async () => {
          await api('/api/note/delete', {
            method: 'POST',
            body: JSON.stringify({ path: btn.dataset.delPath }),
          });
          showToast(t('toastDeleted'));
          await loadState(true);
        };
      });

      document.querySelectorAll('[data-open-note]').forEach((el) => {
        el.onclick = () => openNoteModal(el.dataset.openNote);
      });

      document.querySelectorAll('[data-wspike]').forEach((el) => {
        el.onclick = () => {
          const step = Number(el.dataset.wspike);
          if (state.expandedSpikes.has(step)) state.expandedSpikes.delete(step);
          else state.expandedSpikes.add(step);
          render();
        };
      });

      // Drag and drop between Kanban columns
      document.querySelectorAll('[data-drag-path]').forEach((card) => {
        card.addEventListener('dragstart', () => {
          state.dragTaskPath = card.dataset.dragPath;
        });
      });

      document.querySelectorAll('[data-drop-col]').forEach((col) => {
        col.addEventListener('dragover', (e) => {
          e.preventDefault();
          col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', async (e) => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const filePath = state.dragTaskPath;
          state.dragTaskPath = null;
          if (!filePath) return;
          await api('/api/tasks/status', {
            method: 'POST',
            body: JSON.stringify({ path: filePath, status: col.dataset.dropCol }),
          });
          showToast(t('toastSaved'));
          await loadState(true);
        });
      });

      document.getElementById('searchForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        state.searchQuery = document.getElementById('searchInput').value.trim();
        if (!state.searchQuery) {
          state.searchResults = null;
          render();
          return;
        }
        const res = await api(`/api/search?q=${encodeURIComponent(state.searchQuery)}`);
        state.searchResults = res.items || [];
        render();
      });

      document.getElementById('btnClearSearch')?.addEventListener('click', () => {
        state.searchQuery = '';
        state.searchResults = null;
        render();
      });

      document.getElementById('logFilterInput')?.addEventListener('input', (e) => {
        state.logFilter = e.target.value;
        render();
        const inp = document.getElementById('logFilterInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });

      document.getElementById('btnClearLogs')?.addEventListener('click', async () => {
        await api('/api/logs/clear', { method: 'POST' });
        showToast(t('toastDeleted'));
        await loadState(true);
      });

      document.querySelectorAll('[data-log-cat]').forEach((btn) => {
        btn.onclick = () => {
          state.logCat = btn.dataset.logCat;
          render();
        };
      });

      document.querySelectorAll('[data-log-toggle]').forEach((el) => {
        el.onclick = () => {
          const id = el.dataset.logToggle;
          if (state.expandedLogs.has(id)) state.expandedLogs.delete(id);
          else state.expandedLogs.add(id);
          render();
        };
      });
    }

    loadState(true).catch((err) => {
      document.getElementById('app').innerHTML = `<div class="card" style="margin:24px;">Error: ${esc(err.message)}</div>`;
    });
  </script>
</body>
</html>
